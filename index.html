
<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#225b3d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Habit APP">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" href="./assets/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <title>Habit APP</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css?v=60-article-brand">
</head>
<body>
  <main id="app"></main>

  <nav class="bottom-nav" aria-label="Hlavní navigace">
    <button class="bottom-nav-item" data-screen="home" type="button">
      <span class="bottom-nav-icon">⌂</span><span>Domů</span>
    </button>
    <button class="bottom-nav-item" data-screen="today" type="button">
      <span class="bottom-nav-icon">✓</span><span>Dnes</span>
    </button>
    <button class="bottom-nav-item" data-screen="habits" type="button">
      <span class="bottom-nav-icon">☑</span><span>Návyky</span>
    </button>
    <button class="bottom-nav-item" data-screen="knowhow" type="button">
      <span class="bottom-nav-icon">✦</span><span>Know HOW</span>
    </button>
    <button class="bottom-nav-item bottom-nav-menu" id="more-nav" type="button" aria-label="Další části aplikace" aria-expanded="false">
  	<span class="bottom-nav-icon">☰</span><span>Více</span>
	</button>
  </nav>

  <div id="more-panel" class="more-panel hidden" aria-hidden="true">
    <div class="more-panel-inner">
      <div class="more-panel-title">Další části</div>
      <button type="button" class="more-panel-link" data-screen="calendar">Kalendář</button>
      <button type="button" class="more-panel-link" data-screen="shopping">☷ Seznamy</button>
      <button type="button" class="more-panel-link" data-screen="devices">Zařízení a Garmin</button>
    </div>
  </div>

  <script type="module" src="src/app.js?v=60-article-brand"></script>
</body>
</html>
