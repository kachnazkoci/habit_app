name: Garmin data update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-garmin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install garminconnect

      - name: Check required secrets
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          required = [
              "GARMIN_EMAIL", "GARMIN_PASSWORD", "GARMIN_TOKENS_JSON",
              "SUPABASE_URL", "SUPABASE_SECRET_KEY"
          ]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              print("Chybí GitHub Secrets: " + ", ".join(missing))
              sys.exit(1)
          print("Všechny požadované secrets jsou nastavené.")
          PY

      - name: Stop before data transfer implementation
        run: |
          echo "::error::Tento workflow je zatím bezpečná kostra. Ještě je potřeba ověřit formát Garmin tokenů a doplnit bezpečné načtení/uložení tokenů a CSV do soukromého Supabase Storage."
          exit 1
